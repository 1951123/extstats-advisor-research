name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-historical-advisor:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev,advisor]'
      - name: Run tests
        run: python -m pytest
      - name: Check Ruff
        run: ruff check .
      - name: Check formatting
        run: ruff format --check .
      - name: Check CLI
        run: extstats-research --help

  test-frozen-v2-advisor:
    runs-on: ubuntu-latest
    env:
      EXTSTATS_ADVISOR_VALIDATION: v2
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install frozen v2 test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev,advisor-v2]'
      - name: Run frozen v2 contract tests
        run: |
          set +e
          python -m pytest --junitxml=/tmp/pytest-frozen-v2.xml
          status=$?
          if [ "$status" -ne 0 ]; then
            python - <<'PY'
          import xml.etree.ElementTree as ET

          root = ET.parse("/tmp/pytest-frozen-v2.xml").getroot()
          for case in root.iter("testcase"):
              failure = case.find("failure")
              error = case.find("error")
              detail = failure if failure is not None else error
              if detail is not None:
                  message = detail.get("message", "pytest failure")
                  text = " ".join((detail.text or "").split())
                  print(f"::error file={case.get('classname','')},{case.get('name','')}::{message} {text}")
          PY
          fi
          exit "$status"
      - name: Check Ruff
        run: ruff check .
      - name: Check formatting
        run: ruff format --check .
      - name: Check CLI
        run: extstats-research --help
